[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpitd"
version = "0.1.0"
description = "Hierarchical physics-integrated transformer for cumulative thermal deformation prediction."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Hang Xu" }
]
dependencies = [
  "numpy>=2.0,<3",
  "torch>=2.4"
]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.scripts]
hpitd = "hpitd.cli:main"

[tool.setuptools]
package-dir = {"" = "CODE/Computation"}

[tool.setuptools.packages.find]
where = ["CODE/Computation"]

[tool.ruff]
line-length = 100
target-version = "py310"
